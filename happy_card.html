<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doğum Günü Kartı</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .card {
            width: 400px;
            height: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: rotateY(5deg) rotateX(5deg);
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            border-radius: 20px;
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            color: white;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        p {
            font-size: 24px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .balloon {
            position: absolute;
            width: 40px;
            height: 50px;
            border-radius: 50% 50% 50% 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: float 6s ease-in-out infinite;
        }

        .balloon::before {
            content: '';
            position: absolute;
            width: 2px;
            height: 60px;
            background: rgba(0, 0, 0, 0.2);
            bottom: -60px;
        }

        .balloon1 {
            background: #FF6B6B;
            left: 20px;
            top: 50px;
            animation-delay: 0s;
        }

        .balloon2 {
            background: #FFD93D;
            right: 20px;
            top: 80px;
            animation-delay: 1s;
        }

        .balloon3 {
            background: #6BCB77;
            left: 50px;
            bottom: 50px;
            animation-delay: 2s;
        }

        .balloon4 {
            background: #4D96FF;
            right: 50px;
            bottom: 50px;
            animation-delay: 1.5s;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #FFD93D;
            animation: confetti-fall 3s ease-in forwards;
            pointer-events: none;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-30px);
            }
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(400px) rotateZ(360deg);
                opacity: 0;
            }
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        button:hover {
            background: #667eea;
            color: white;
            transform: scale(1.1);
        }

        .music-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: 2px solid white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .music-toggle:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .music-toggle.playing {
            background: rgba(255, 255, 255, 0.7);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body>
    <button class="music-toggle" id="musicBtn">🔊 Müzik Çalıyor</button>

    <div class="card" id="card">
        <div class="card-inner">
            <div class="balloon balloon1"></div>
            <div class="balloon balloon2"></div>
            <div class="balloon balloon3"></div>
            <div class="balloon balloon4"></div>

            <h1>🎉 Doğum Günün Kutlu Olsun! 🎉</h1>
            <p>Mutlu Yıllar!</p>
            <button onclick="createConfetti()">Konfeti Yağdır 🎊</button>
        </div>
    </div>

    <script>
        let audioContext;
        let isPlaying = false;
        const musicBtn = document.getElementById('musicBtn');

        // Sayfa yüklendiğinde müzik başla
        window.addEventListener('load', () => {
            createConfetti();
            startContinuousMusic();
        });

        // Müzik toggle
        musicBtn.addEventListener('click', () => {
            if (isPlaying) {
                isPlaying = false;
                musicBtn.textContent = '🔇 Müzik Durduruldu';
                musicBtn.classList.remove('playing');
            } else {
                isPlaying = true;
                startContinuousMusic();
                musicBtn.textContent = '🔊 Müzik Çalıyor';
                musicBtn.classList.add('playing');
            }
        });

        // Devamlı müzik çal
        function startContinuousMusic() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (!isPlaying) {
                isPlaying = true;
                musicBtn.textContent = '🔊 Müzik Çalıyor';
                musicBtn.classList.add('playing');
            }

            playBirthdayMelody();
        }

      function startContinuousMusic() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (!isPlaying) {
        isPlaying = true;
        musicBtn.textContent = '🔊 Müzik Çalıyor';
        musicBtn.classList.add('playing');
        playBirthdayMelody(); // Müziği başlat
    }
}

function playBirthdayMelody() {
    if (!isPlaying) return;


    const notes = [
        // 1. Mısra: İyi ki doğ-dun sa-na
        { freq: 262, duration: 0.3 }, { freq: 262, duration: 0.1 }, { freq: 294, duration: 0.4 }, { freq: 262, duration: 0.4 }, { freq: 349, duration: 0.4 }, { freq: 330, duration: 0.8 }, 
        
        // 2. Mısra: İyi ki doğ-dun sa-na
        { freq: 262, duration: 0.3 }, { freq: 262, duration: 0.1 }, { freq: 294, duration: 0.4 }, { freq: 262, duration: 0.4 }, { freq: 392, duration: 0.4 }, { freq: 349, duration: 0.8 }, 

        // 3. Mısra: İyi ki doğ-dun iyi ki doğ-dun (Yükseliş)
        { freq: 262, duration: 0.3 }, { freq: 262, duration: 0.1 }, { freq: 523, duration: 0.4 }, { freq: 440, duration: 0.4 }, { freq: 349, duration: 0.4 }, { freq: 330, duration: 0.4 }, { freq: 294, duration: 0.8 }, 

        // 4. Mısra: Mut-lu yıl-lar sa-na
        { freq: 466, duration: 0.3 }, { freq: 466, duration: 0.1 }, { freq: 440, duration: 0.4 }, { freq: 349, duration: 0.4 }, { freq: 392, duration: 0.4 }, { freq: 349, duration: 1.2 } 
    ];

    let startTime = audioContext.currentTime;
    let totalDuration = 0;

    notes.forEach(note => {
        playNote(note.freq, startTime + totalDuration, note.duration);
        totalDuration += note.duration;
    });

    setTimeout(() => {
        if (isPlaying) playBirthdayMelody();
    }, (totalDuration * 1000) + 500);
}
        function playNote(freq, time, duration) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = freq;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.2, time);
            gainNode.gain.exponentialRampToValueAtTime(0.01, time + duration);

            oscillator.start(time);
            oscillator.stop(time + duration);
        }

        // Konfeti efekti
        function createConfetti() {
            const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF8C42', '#A569BD'];
            const confettiCount = 30;

            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.delay = Math.random() * 0.5 + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 3500);
            }
        }
    </script>
</body>
</html>
